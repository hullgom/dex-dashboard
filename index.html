<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DEX 대시보드</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="grid">
    <!-- 왼쪽: 시계 + 날씨 -->
    <section class="card clock-card">
      <div id="time" class="time">--:--</div>
      <div class="date-row">
        <span id="date" class="date">----</span>
        <span id="seconds" class="seconds">--</span>
      </div>
      <div id="market" class="market"></div>
    </section>

    <section class="card weather-card">
      <div class="card-head">
        <h2>날씨 <span id="w-place" class="muted"></span></h2>
        <span id="w-updated" class="muted small"></span>
      </div>
      <div class="w-now">
        <div id="w-icon" class="w-icon">·</div>
        <div>
          <div id="w-temp" class="w-temp">--°</div>
          <div id="w-desc" class="w-desc">불러오는 중…</div>
        </div>
        <div class="w-meta">
          <div>체감 <b id="w-feel">--</b></div>
          <div>최고/최저 <b id="w-hilo">--</b></div>
          <div>습도 <b id="w-hum">--</b> · 바람 <b id="w-wind">--</b></div>
          <div>미세 <b id="w-pm10">--</b> · 초미세 <b id="w-pm25">--</b></div>
        </div>
      </div>
      <div id="w-hourly" class="w-hourly"></div>
      <div id="w-daily" class="w-daily"></div>
    </section>

    <!-- 오른쪽 위: 캘린더 -->
    <section class="card cal-card">
      <div class="card-head">
        <h2>캘린더</h2>
        <div class="seg" id="cal-mode">
          <button data-mode="AGENDA">일정</button>
          <button data-mode="WEEK">주</button>
          <button data-mode="MONTH">월</button>
        </div>
      </div>
      <div id="cal-body" class="cal-body"></div>
    </section>

    <!-- 오른쪽 아래: 주식 -->
    <section class="card stock-card" data-stock="kr" data-code="005930" data-name="삼성전자">
      <div class="card-head">
        <h2>삼성전자 <span class="muted small">005930</span></h2>
        <div class="seg kr-range">
          <button data-r="area/day">당일</button>
          <button data-r="candle/day">일봉</button>
          <button data-r="candle/week">주봉</button>
          <button data-r="candle/month">월봉</button>
        </div>
      </div>
      <div class="stock-body"></div>
    </section>

    <section class="card stock-card" data-stock="kr" data-code="000660" data-name="SK하이닉스">
      <div class="card-head">
        <h2>SK하이닉스 <span class="muted small">000660</span></h2>
        <div class="seg kr-range">
          <button data-r="area/day">당일</button>
          <button data-r="candle/day">일봉</button>
          <button data-r="candle/week">주봉</button>
          <button data-r="candle/month">월봉</button>
        </div>
      </div>
      <div class="stock-body"></div>
    </section>

    <section class="card stock-card" data-stock="us" data-symbol="AMEX:SOXL">
      <div class="card-head">
        <h2>SOXL <span class="muted small">반도체 3배 ETF</span></h2>
      </div>
      <div class="stock-body tv"></div>
    </section>
  </main>

  <!-- 화면 오른쪽 아래 도구 버튼 -->
  <div class="tools">
    <button id="btn-full" title="전체화면">⛶</button>
    <button id="btn-settings" title="설정">⚙</button>
  </div>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>설정</h2>
      <label>날씨 지역 이름
        <input name="place" placeholder="서울">
      </label>
      <div class="row">
        <label>위도 <input name="lat" inputmode="decimal" placeholder="37.5665"></label>
        <label>경도 <input name="lon" inputmode="decimal" placeholder="126.9780"></label>
        <button type="button" id="btn-geo">현재 위치</button>
      </div>
      <label>구글 캘린더 ID (여러 개면 쉼표로 구분)
        <input name="cals" placeholder="내gmail주소@gmail.com, 가족캘린더ID@group.calendar.google.com">
      </label>
      <label class="check"><input type="checkbox" name="calDark"> 캘린더 어둡게 표시 (색 반전)</label>
      <label class="check"><input type="checkbox" name="chartDark"> 국내 주식 차트 어둡게 표시 (색 반전)</label>
      <p class="muted small">설정은 이 기기 브라우저에만 저장됩니다.</p>
      <div class="row end">
        <button value="cancel" formnovalidate>취소</button>
        <button value="save" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
